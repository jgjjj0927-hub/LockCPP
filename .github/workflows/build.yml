name: Build videolocker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /utf-8 videolocker.cpp /link strmiids.lib ole32.lib oleaut32.lib uuid.lib advapi32.lib user32.lib gdi32.lib shell32.lib wbemuuid.lib /OUT:videolocker.exe

      - name: Verify binary
        shell: cmd
        run: |
          if not exist videolocker.exe (
            echo Build failed: videolocker.exe not found
            exit /b 1
          )
          dir videolocker.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videolocker-x64
          path: videolocker.exe
          if-no-files-found: error
